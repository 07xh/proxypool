name: ProxyPool Windows EXE

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '**.py'
      - 'pool.json'
      - 'build_windows.cmd'
      - '.github/workflows/proxypool-desktop.yml'
  push:
    branches: [main]
    paths:
      - '**.py'
      - 'pool.json'
      - 'build_windows.cmd'
      - '.github/workflows/proxypool-desktop.yml'

permissions:
  contents: read

env:
  PYTHONUTF8: '1'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax checks
        run: python -m compileall -q .
      - name: Full offline and loopback regression suite
        run: python verify.py
      - name: Install packaging tool
        run: python -m pip install --upgrade pyinstaller
      - name: Build portable EXE
        shell: cmd
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name ProxyPoolManager --add-data "pool.json;." manager_gui.py
      - name: Upload unsigned test EXE
        uses: actions/upload-artifact@v4
        with:
          name: ProxyPoolManager-Windows-x64-unsigned
          path: dist/ProxyPoolManager.exe
          if-no-files-found: error
