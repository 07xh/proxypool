name: ProxyPool tests

on:
  push:
    branches: [main]
    paths:
      - '**.py'
      - 'pool.json'
      - '.github/workflows/proxypool-ci.yml'
  pull_request:
    paths:
      - '**.py'
      - 'pool.json'
      - '.github/workflows/proxypool-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: '1'

jobs:
  test:
    name: Python 3.11 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check syntax
        run: python -m compileall -q .
      - name: Run offline tests and loopback mock checks
        run: python verify.py
